<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mind Base</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
:root {
  --bg: #eef3fb;
  --surface: rgba(255,255,255,0.42);
  --surface-strong: rgba(255,255,255,0.70);
  --surface-glow: rgba(255,255,255,0.82);
  --border: rgba(255,255,255,0.54);
  --text: #172033;
  --text-2: #4d5870;
  --text-3: #7d879c;
  --accent: #4F46E5;
  --accent-2: #0EA5E9;
  --accent-bg: rgba(79,70,229,0.12);
  --shadow: 0 12px 42px rgba(40,55,100,0.12);
  --shadow-lg: 0 28px 80px rgba(35,48,93,0.22);
  --blur: blur(28px) saturate(1.45);
  --r: 24px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow-x:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;
  background:
    radial-gradient(circle at 18% 12%, rgba(14,165,233,.34), transparent 32%),
    radial-gradient(circle at 82% 18%, rgba(236,72,153,.30), transparent 30%),
    radial-gradient(circle at 50% 88%, rgba(245,158,11,.24), transparent 36%),
    linear-gradient(135deg,#eef7ff 0%,#f7f2ff 48%,#fff7ed 100%);
  color:var(--text);
  transition:background .3s,color .3s;
  min-height:100vh;position:relative;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.18) 1px,transparent 1px);
  background-size:64px 64px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.55),transparent 75%);
}

/* ── BACKGROUND BLOBS ── */
.blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(90px);animation:drift 22s ease-in-out infinite}
.b1{width:700px;height:700px;background:radial-gradient(circle,rgba(56,189,248,.45),transparent 70%);top:-160px;left:-120px;animation-duration:24s}
.b2{width:560px;height:560px;background:radial-gradient(circle,rgba(236,72,153,.34),transparent 70%);top:42%;right:-110px;animation-duration:28s;animation-delay:-9s}
.b3{width:520px;height:520px;background:radial-gradient(circle,rgba(124,58,237,.30),transparent 70%);bottom:-80px;left:24%;animation-duration:20s;animation-delay:-4s}
.b4{width:360px;height:360px;background:radial-gradient(circle,rgba(251,191,36,.34),transparent 70%);top:24%;left:54%;animation-duration:30s;animation-delay:-16s}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(28px,-38px) scale(1.05)}50%{transform:translate(-18px,28px) scale(.96)}75%{transform:translate(36px,18px) scale(1.03)}}

/* ── BG CARDS ── */
.bgcards{position:fixed;inset:0;z-index:1;pointer-events:none}
.bgc{
  position:absolute;width:260px;padding:18px 20px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  opacity:.28;filter:blur(3px);
  animation:floatc 28s ease-in-out infinite;
}
.bgc-t{font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:5px}
.bgc-b{font-size:10px;color:var(--text-3);line-height:1.5}
@keyframes floatc{0%,100%{transform:translateY(0) rotate(var(--r2,0deg))}40%{transform:translateY(-14px) rotate(calc(var(--r2,0deg) + .8deg))}70%{transform:translateY(8px) rotate(calc(var(--r2,0deg) - .5deg))}}

/* ── LAYOUT ── */
.app{position:relative;z-index:10;min-height:100vh;display:flex;flex-direction:column}

/* ── HEADER ── */
header{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center;gap:18px;
  padding:18px 28px;
  background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-bottom:1px solid var(--border);
  box-shadow:0 12px 36px rgba(255,255,255,.16) inset,0 14px 50px rgba(29,42,78,.08);
  position:sticky;top:0;z-index:50;
}
.logo{display:flex;align-items:center;gap:11px}
.hbtns{display:flex;gap:10px;justify-content:flex-end}
.logo-icon{
  width:38px;height:38px;border-radius:11px;
  background:linear-gradient(140deg,#38BDF8 0%,#8B5CF6 45%,#F472B6 72%,#FBBF24 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(124,58,237,.38);
  flex-shrink:0;
}
.logo-icon i{
  font-size:21px;color:#fff;
  filter:drop-shadow(0 1px 2px rgba(20,30,60,.22));
}
.logo-text{
  font-size:19px;font-weight:700;letter-spacing:-.3px;
  background:linear-gradient(135deg,var(--accent) 0%,#C026D3 50%,#EC4899 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.ibtn{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--border);
  background:var(--surface);backdrop-filter:var(--blur);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:17px;transition:all .2s;color:var(--text);
}
.ibtn:hover{background:var(--surface-strong);transform:scale(1.06)}

/* ── MAIN ── */
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:26px 20px 48px}

/* ── HERO ── */
.hero{text-align:center;margin-bottom:24px;transition:all .4s}
.hero.compact{margin-bottom:16px}
.hero h1{
  font-size:clamp(30px,5vw,48px);font-weight:760;letter-spacing:-1.2px;
  line-height:1.1;margin-bottom:10px;
}
.hero p{font-size:16px;color:var(--text-2);max-width:420px;margin:0 auto;line-height:1.55}

/* ── SEARCH ── */
.search-wrap{width:100%;max-width:760px;position:relative;margin-bottom:18px}
.search-input{
  width:100%;padding:17px 52px 17px 22px;font-size:17px;font-family:inherit;
  border:1px solid var(--border);border-radius:20px;
  background:var(--surface-strong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  color:var(--text);outline:none;box-shadow:var(--shadow);transition:all .3s;
}
.search-input:focus{border-color:var(--accent);box-shadow:var(--shadow),0 0 0 3px var(--accent-bg)}
.search-input::placeholder{color:var(--text-3)}
.search-ico{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:19px;pointer-events:none}

.workspace{width:100%;max-width:1180px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}

/* ── SEGMENTS ── */
.section-nav{
  position:sticky;top:92px;width:100%;display:flex;flex-direction:column;gap:14px;
  padding:16px;border:1px solid var(--border);border-radius:24px;
  background:rgba(255,255,255,.30);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  box-shadow:var(--shadow);
}
.nav-label{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--text-3);letter-spacing:.08em;padding:0 4px}
.segmented{
  position:relative;display:flex;flex-direction:column;gap:4px;padding:5px;width:100%;
  border:1px solid var(--border);border-radius:18px;background:rgba(255,255,255,.24);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.58);
}
.seg-indicator{
  position:absolute;top:5px;left:5px;height:40px;
  border-radius:14px;background:linear-gradient(135deg,rgba(255,255,255,.94),rgba(255,255,255,.60));
  box-shadow:0 10px 30px rgba(31,41,70,.16),inset 0 1px 0 rgba(255,255,255,.85);
  transition:transform .42s cubic-bezier(.2,.9,.2,1),width .42s cubic-bezier(.2,.9,.2,1),height .42s cubic-bezier(.2,.9,.2,1);
  pointer-events:none;
}
.seg-btn{
  position:relative;z-index:1;border:0;background:transparent;color:var(--text-2);
  padding:11px 13px;border-radius:14px;white-space:nowrap;font:700 13px/1.15 inherit;
  cursor:pointer;transition:color .24s,transform .24s;text-align:left;letter-spacing:0;
}
.seg-btn:hover{color:var(--text);transform:translateY(-1px)}
.seg-btn.on{color:var(--text)}

/* ── CATEGORY PILLS ── */
.cats{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto;padding-right:2px}
.cats::-webkit-scrollbar{width:6px}
.cats::-webkit-scrollbar-thumb{background:rgba(80,90,120,.20);border-radius:999px}
.pill{
  width:100%;padding:9px 11px;border-radius:12px;border:1px solid transparent;
  background:transparent;cursor:pointer;font-size:13px;font-weight:650;color:var(--text-2);
  transition:all .2s;font-family:inherit;text-align:left;line-height:1.25;
}
.pill:hover,.pill.on{background:rgba(255,255,255,.46);border-color:var(--border);color:var(--text);box-shadow:0 6px 18px rgba(35,48,93,.08)}

/* ── CARD ── */
.card-area{width:100%;min-width:0}
.card{
  max-width:760px;margin:0 auto;
  background:var(--surface-strong);border:1px solid var(--border);
  border-radius:var(--r);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  padding:32px 32px 28px;box-shadow:var(--shadow-lg);
  animation:cardin .45s cubic-bezier(.34,1.56,.64,1) both;
  cursor:pointer;transition:transform .3s,box-shadow .3s;
  -webkit-tap-highlight-color:transparent;user-select:none;
}
.card:hover{transform:translateY(-2px);box-shadow:0 28px 72px rgba(80,40,140,.22)}
@keyframes cardin{from{opacity:0;transform:translateY(28px) scale(.96)}to{opacity:1;transform:none}}

.cat-badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 12px;border-radius:999px;
  background:var(--accent-bg);color:var(--accent);
  font-size:12px;font-weight:600;margin-bottom:18px;letter-spacing:.2px;
}
.card-q{font-size:14px;color:var(--text-2);font-style:italic;margin-bottom:14px;line-height:1.6}
.card-title{font-size:24px;font-weight:700;letter-spacing:-.4px;margin-bottom:14px;color:var(--text)}
.card-body{
  font-size:15px;line-height:1.75;color:var(--text-2);
  white-space:pre-wrap;overflow-wrap:anywhere;
}
.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:26px;padding-top:18px;border-top:1px solid var(--border)}
.card-btns{display:flex;gap:8px}
.cbtn{
  padding:9px 18px;border-radius:999px;border:1px solid var(--border);
  background:var(--surface);cursor:pointer;font-size:13px;font-weight:500;
  color:var(--text-2);transition:all .2s;display:flex;align-items:center;gap:5px;
  font-family:inherit;
}
.cbtn:hover{background:var(--surface-strong);transform:scale(1.02)}
.cbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.cbtn.primary:hover{opacity:.9}
.cbtn.fav-on{color:#EF4444;border-color:#EF4444;background:rgba(239,68,68,.09)}
.counter{text-align:center;margin-top:13px;font-size:12px;color:var(--text-3)}
.swipe-hint{text-align:center;margin-top:8px;font-size:12px;color:var(--text-3)}

.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;animation:fadein .35s ease both}
.grid-card{
  min-height:190px;display:flex;flex-direction:column;padding:18px;
  background:var(--surface-strong);border:1px solid var(--border);border-radius:22px;
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  box-shadow:var(--shadow);cursor:pointer;transition:transform .24s,box-shadow .24s,background .24s;
}
.grid-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);background:var(--surface-glow)}
.grid-card-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.grid-card-icon{font-size:20px}
.grid-card-index{font-size:11px;font-weight:700;color:var(--text-3)}
.grid-card-title{font-size:16px;font-weight:760;color:var(--text);line-height:1.25;margin-bottom:9px}
.grid-card-body{
  color:var(--text-2);font-size:13px;line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;
  overflow-wrap:anywhere;white-space:pre-wrap;
}
.grid-card-actions{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:16px}
.grid-card-more{font-size:12px;font-weight:700;color:var(--accent)}
.section-head{
  display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:14px;
  padding:0 2px;
}
.section-title{font-size:22px;font-weight:780;color:var(--text);letter-spacing:-.2px}
.section-count{color:var(--text-3);font-size:12px;font-weight:750;white-space:nowrap}

/* ── WELCOME ── */
.welcome{animation:fadein .4s ease both}
.preview-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:560px}
.pcard{
  padding:14px 18px;background:var(--surface);border:1px solid var(--border);
  border-radius:16px;backdrop-filter:blur(10px);cursor:pointer;
  transition:all .2s;min-width:140px;
}
.pcard:hover{background:var(--surface-strong);transform:translateY(-2px);box-shadow:var(--shadow)}
.pcard-e{font-size:22px;margin-bottom:6px}
.pcard-t{font-size:13px;font-weight:600;color:var(--text)}

/* ── EMPTY ── */
.empty{text-align:center;padding:48px 20px;animation:fadein .35s ease both}
.empty-e{font-size:44px;margin-bottom:14px}
.empty-h{font-size:19px;font-weight:600;margin-bottom:7px}
.empty-t{font-size:14px;color:var(--text-2)}

/* ── FAVS ── */
.fav-view{width:100%;max-width:580px;animation:fadein .35s ease both}
.fav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:16px}
.fcard{
  background:var(--surface);border:1px solid var(--border);
  border-radius:18px;backdrop-filter:blur(10px);padding:18px;
  cursor:pointer;transition:all .2s;
}
.fcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.fcard-preview{font-size:12px;color:var(--text-2);line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:28px;left:50%;
  transform:translateX(-50%) translateY(80px);
  background:var(--text);color:var(--bg);
  padding:11px 22px;border-radius:999px;font-size:13px;font-weight:500;
  z-index:200;transition:transform .35s cubic-bezier(.34,1.56,.64,1);pointer-events:none;
  white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0)}

@keyframes fadein{from{opacity:0}to{opacity:1}}

@media(max-width:600px){
  header{padding:14px 16px}
  main{padding:34px 14px 36px}
  .workspace{display:flex;flex-direction:column;gap:16px}
  .section-nav{position:static;padding:12px;border-radius:20px}
  .segmented{border-radius:16px;flex-direction:row;overflow-x:auto;scrollbar-width:none}
  .segmented::-webkit-scrollbar{display:none}
  .seg-indicator{height:calc(100% - 10px)}
  .seg-btn{padding:9px 12px;font-size:12px}
  .cats{flex-direction:row;max-height:none;overflow-x:auto;width:100%;padding:0 2px 4px;scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .pill{font-size:12px;white-space:nowrap;width:auto;text-align:center}
  .section-head{align-items:flex-start;flex-direction:column;gap:4px}
  .card{padding:22px 20px 20px}
  .card-title{font-size:20px}
  .card-grid{grid-template-columns:1fr}
}

/* ── APPLE-INSPIRED REFINEMENT ── */
body{
  background:
    radial-gradient(circle at 18% 8%, rgba(186,230,253,.72), transparent 34%),
    radial-gradient(circle at 86% 16%, rgba(233,213,255,.62), transparent 30%),
    radial-gradient(circle at 48% 92%, rgba(254,243,199,.68), transparent 38%),
    linear-gradient(135deg,#f7fbff 0%,#f8f5ff 48%,#fffaf2 100%);
}
.bgcards{opacity:.18}
.blob{filter:blur(110px);opacity:.70}
header{
  padding:14px 28px;
  background:rgba(255,255,255,.54);
  box-shadow:0 1px 0 rgba(255,255,255,.72) inset,0 10px 34px rgba(40,55,100,.08);
}
.logo-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#38bdf8,#8b5cf6 45%,#f472b6 72%,#fbbf24);box-shadow:0 8px 22px rgba(79,70,229,.22)}
.logo-text{
  font-size:18px;letter-spacing:-.2px;
  background:linear-gradient(135deg,#0ea5e9 0%,#6366f1 34%,#d946ef 68%,#f59e0b 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
}
.ibtn{
  width:36px;height:36px;font-size:16px;border-radius:999px;
  background:rgba(255,255,255,.44);box-shadow:inset 0 1px 0 rgba(255,255,255,.62);
}
.ibtn:hover{transform:translateY(-1px);background:rgba(255,255,255,.72)}
.top-search{
  position:sticky;top:64px;z-index:46;display:grid;grid-template-rows:0fr;
  width:100%;padding:0 20px;overflow:hidden;
  transition:grid-template-rows .34s cubic-bezier(.2,.9,.2,1),padding .34s cubic-bezier(.2,.9,.2,1);
}
.top-search.open{grid-template-rows:1fr;padding:12px 20px 0}
.top-search-inner{
  min-height:0;width:min(760px,100%);margin:0 auto;display:flex;align-items:center;gap:12px;
  padding:0 14px 0 18px;border-radius:22px;border:1px solid rgba(255,255,255,.70);
  background:rgba(255,255,255,.70);backdrop-filter:blur(24px) saturate(1.25);
  box-shadow:0 18px 50px rgba(35,48,93,.10),inset 0 1px 0 rgba(255,255,255,.82);
  opacity:0;transform:translateY(-8px) scale(.985);
  transition:opacity .28s ease,transform .34s cubic-bezier(.2,.9,.2,1),padding .34s,height .34s;
}
.top-search.open .top-search-inner{height:54px;opacity:1;transform:none}
.top-search-inner i{color:var(--text-3)}
.top-search-inner input{
  flex:1;min-width:0;border:0;background:transparent;outline:none;color:var(--text);
  font:600 16px/1.2 inherit;
}
.top-search-inner input::placeholder{color:var(--text-3)}
.top-search-inner button{
  width:34px;height:34px;border:0;border-radius:999px;background:rgba(0,0,0,.04);
  color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;
}
main{padding:38px 22px 56px}
.top-categories{
  width:100%;display:flex;justify-content:center;min-width:0;overflow:hidden;
  padding:0;margin:0;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;
}
.hero{margin-bottom:22px}
.hero h1{font-size:clamp(34px,5vw,50px);font-weight:800;letter-spacing:-1.25px}
.hero p{font-size:15px;color:var(--text-2)}
.search-wrap{max-width:760px;margin-bottom:22px}
.search-input{
  height:56px;border-radius:22px;padding-left:24px;
  background:rgba(255,255,255,.62);
  box-shadow:0 18px 50px rgba(35,48,93,.10),inset 0 1px 0 rgba(255,255,255,.82);
}
.search-input:focus{box-shadow:0 18px 50px rgba(35,48,93,.12),0 0 0 4px rgba(79,70,229,.10)}
.search-ico{color:var(--text-3)}
.workspace{max-width:1180px;display:block}
.category-shell{
  display:none;
}
.category-shell .segmented{display:none}
.segmented{
  width:100%;max-width:1180px;display:flex;flex-direction:row;gap:3px;
  padding:5px;overflow-x:auto;border-radius:18px;border:1px solid rgba(255,255,255,.72);
  background:rgba(255,255,255,.42);backdrop-filter:blur(24px) saturate(1.25);
  box-shadow:0 18px 46px rgba(35,48,93,.09),inset 0 1px 0 rgba(255,255,255,.74);
  scrollbar-width:none;
}
.segmented::-webkit-scrollbar{display:none}
.seg-indicator{
  top:5px;left:5px;height:42px;border-radius:14px;
  background:rgba(255,255,255,.92);
  box-shadow:0 10px 28px rgba(35,48,93,.13),inset 0 1px 0 rgba(255,255,255,.9);
  will-change:transform,width;
  transition:
    transform .46s cubic-bezier(.22,1,.36,1),
    width .46s cubic-bezier(.22,1,.36,1),
    height .46s cubic-bezier(.22,1,.36,1);
}
.seg-btn{
  flex:1 1 0;min-width:max-content;min-height:42px;display:flex;align-items:center;gap:5px;justify-content:center;
  padding:9px 9px;border-radius:14px;text-align:center;font-size:11px;font-weight:720;color:var(--text-2);
}
.seg-btn i{font-size:13px}
.seg-btn small{font-size:9px;color:var(--text-3);font-weight:800}
.seg-btn.on,.seg-btn.on small{color:var(--text)}
.filter-row{
  width:100%;max-width:1040px;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
}
.cats{
  flex:1;display:flex;flex-direction:row;flex-wrap:wrap;gap:8px;max-height:none;overflow:visible;padding:0;
}
.pill{
  width:auto;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.42);
  border:1px solid rgba(255,255,255,.58);font-size:12px;font-weight:680;color:var(--text-2);
  text-align:center;white-space:nowrap;
}
.pill:hover,.pill.on{background:rgba(255,255,255,.84);color:var(--text);box-shadow:0 8px 20px rgba(35,48,93,.08)}
.chip-note{font-size:13px;color:var(--text-3);padding:8px 2px}
.reset-filter{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;
  border-radius:999px;border:1px solid rgba(255,255,255,.58);background:rgba(255,255,255,.44);
  color:var(--text-2);font:700 12px/1 inherit;cursor:pointer;transition:all .2s;
}
.reset-filter:hover{background:rgba(255,255,255,.78);color:var(--text);transform:translateY(-1px)}
.card-area{max-width:1180px;margin:0 auto}
.section-head{margin-bottom:18px;padding:0 4px}
.section-title{font-size:24px;font-weight:800;letter-spacing:-.35px}
.section-count{font-size:12px;color:var(--text-3)}
.card-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.grid-card{
  min-height:252px;padding:22px;border-radius:26px;background:rgba(255,255,255,.62);
  border:1px solid rgba(255,255,255,.72);box-shadow:0 18px 54px rgba(35,48,93,.10);
}
.grid-card:hover{transform:translateY(-3px);box-shadow:0 24px 70px rgba(35,48,93,.14)}
.grid-card-top{margin-bottom:14px}
.card-icon{
  width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  color:#4652d8;background:rgba(79,70,229,.10);font-size:17px;
}
.type-label,.main-label{
  display:inline-flex;align-items:center;width:max-content;border-radius:999px;
  color:var(--text-3);font-weight:750;font-size:11px;letter-spacing:.02em;
}
.type-label{padding:5px 8px;background:rgba(255,255,255,.42)}
.main-label{margin-bottom:10px}
.grid-card-title{font-size:18px;font-weight:800;letter-spacing:-.2px;margin-bottom:10px}
.grid-card-body{
  font-size:13px;line-height:1.6;color:var(--text-2);
  max-height:5.2em;
  -webkit-line-clamp:4;white-space:normal;
}
.grid-card-actions{padding-top:18px}
.open-link{
  border:0;background:transparent;color:var(--accent);font:800 13px/1 inherit;cursor:pointer;padding:0;
}
.grid-source{margin-left:auto;margin-right:10px;color:var(--text-3);font-size:11px;font-weight:750;white-space:nowrap}
.mini-fav{
  width:32px;height:32px;border-radius:999px;border:1px solid rgba(255,255,255,.60);
  background:rgba(255,255,255,.45);color:var(--text-3);cursor:pointer;transition:all .2s;
}
.mini-fav:hover,.mini-fav.on{color:#dc4668;background:rgba(255,255,255,.84)}
.modal-backdrop{
  position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;
  padding:22px;background:rgba(15,23,42,.22);backdrop-filter:blur(18px);
}
.modal-backdrop.show{display:flex;animation:fadein .18s ease both}
.detail-modal{
  position:relative;width:min(760px,100%);max-height:min(82vh,860px);overflow:auto;
  padding:56px 34px 34px;border-radius:28px;background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.82);
  box-shadow:0 34px 110px rgba(20,30,60,.26);
}
.modal-close{
  position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:999px;border:0;
  background:rgba(0,0,0,.05);color:var(--text-2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;z-index:2;
}
.modal-kicker{display:flex;justify-content:space-between;gap:16px;margin-bottom:16px;color:var(--text-3);font-size:12px;font-weight:800}
.modal-title{font-size:clamp(26px,4vw,36px);letter-spacing:-.7px;line-height:1.1;margin-bottom:14px;color:var(--text)}
.modal-question{font-size:15px;line-height:1.65;color:var(--text-2);font-style:italic;margin-bottom:18px}
.modal-body{font-size:16px;line-height:1.78;color:var(--text-2);white-space:pre-wrap;overflow-wrap:anywhere}
.modal-source{
  margin-top:22px;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.52);
  border:1px solid rgba(255,255,255,.70);color:var(--text-2);font-size:13px;line-height:1.5;
}
.modal-source span{display:block;margin-bottom:4px;color:var(--text-3);font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.08em}
.modal-actions{margin-top:24px;padding-top:18px;border-top:1px solid var(--border)}
.modal-fav{
  display:inline-flex;align-items:center;gap:8px;border-radius:999px;border:1px solid var(--border);
  background:rgba(255,255,255,.54);padding:10px 14px;color:var(--text-2);font:800 13px/1 inherit;cursor:pointer;
}
.modal-fav.on{color:#dc4668}
.empty{background:rgba(255,255,255,.54);border:1px solid rgba(255,255,255,.70);border-radius:26px;backdrop-filter:var(--blur)}
.empty-e{font-size:34px;color:var(--text-3)}

@media(max-width:980px){
  .card-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filter-row{flex-direction:column}
  .reset-filter{align-self:flex-start}
}
@media(max-width:640px){
  header{display:flex;gap:12px;align-items:center;overflow-x:auto;padding:12px 14px}
  .logo{flex:0 0 auto}
  .top-categories{order:2;flex:1 1 auto;min-width:220px}
  .hbtns{order:3;flex:0 0 auto}
  main{padding:30px 14px 42px}
  .hero h1{font-size:34px}

  .seg-btn{flex:0 0 auto;min-width:max-content}
  .cats{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:3px;scrollbar-width:none}

  .card-grid{grid-template-columns:1fr;gap:14px}
  .grid-card{min-height:220px;padding:20px;border-radius:24px}

  .detail-modal{padding:28px 22px;border-radius:24px;max-height:86vh}

  .modal-body{font-size:15px}
}

    "q": "Ein Mann mit Sorgen hat viel durchgemacht und begann zu beten. Daraufhin fiel ihm die Bibel auf dem Tisch auf und er las folgende Stelle der Bergpredigt: „Sorget nicht für euer Leben, was ihr essen und trinken werdet. Bedeutet das Leben nicht mehr als Essen und Trinken, und ist der Mensch nicht wichtiger als seine Kleidung? Seht euch die Vögel an! Sie säen nichts, sie ernten nichts und sammeln auch keine Vorräte. Euer Vater im Himmel versorgt sie. Meint ihr nicht, dass ihr ihm viel wichtiger seid?",
    "t": "Die Magie des Gebets",
    "c": "Jesus: «In meines Vaters Haus sind viele Wohnungen... Ich gehe hin, euch die Stätte zu bereiten... auf dass ihr seid, wo ich bin.»\n\n«Natürlich ist der Glaube an Gott das allerbeste Heilmittel für alle Sorgen.»\n- William James -\n\n«Der Mensch ist nicht gemacht, um das Leben zu verstehen, sondern um es zu leben.»\n- Santayana -\n\n„Religion gibt mir Glauben, Hoffnung und Mut. Sie vertreibt Spannungen, Ängste, Furcht und Sorgen. Sie gibt meinem Leben einen Sinn - und ein Ziel. Sie macht mich viel, viel glücklicher und gesünder. Sie hilft mir, «eine Oase des Friedens in den Sandstürmen des Lebens» für mich zu schaffen.“\n- Dale Carnegie -\n\n«Ein wenig Philosophie lenkt den Geist des Menschen zum Atheismus hin. Doch die Philosophie in ihrer ganzen Größe führt den Menschen zur Religion.» - Francis Bacon -\n\n«Wer wirklich gläubig ist, entwickelt keine Neurose.» - Dr. A. A. Bril -\n\nEin paar Jahre vor seinem Tod interviewte ich Henry Ford. Ich kannte ihn nicht persönlich und hatte gedacht, dass man ihm die Anstrengungen der vielen Jahre, in denen er sein Weltunternehmen aufgebaut und verwaltet hatte, anmerken würde. Daher war ich überrascht, wie gesund und ruhig und friedlich er mit seinen 78 Jahren aussah. Als ich ihn fragte, ob er sich viele Sorgen im Leben gemacht habe, antwortete er: «Nein, überhaupt keine. Ich glaube, dass Gott die Geschicke lenkt und dass er keinen Rat von mir braucht. Da Gott die Verantwortung hat, bin ich überzeugt, dass sich zum Schluss alles zum Besten wendet. Weshalb sollte ich mir also Sorgen machen?»\n\nJesus erklärte, dass es in der Religion nur zwei wichtige Dinge gebe: Gott zu lieben von ganzem Herzen und unseren Nächsten zu lieben wie uns selbst. Ein Mensch, der so lebt, ist religiös, ob ihm dies bewusst ist oder nicht.\n\n«Alles nun, was ihr wollt, dass euch die Leute tun sollen, das tut ihr ihnen auch.»\nMatthäus 7, Vers 12\n\n«Was einen Menschen zum Christen macht, ist weder die intellektuelle Billigung gewisser Ideen noch die Anpassung an bestimmte Vorschriften, sondern das Erfülltsein von einem gewissen Geist und eine gewisse Lebensführung.»\n- John Baillie, Theologieprofessor -\n\nIn den Vereinigten Staaten passiert durchschnittlich alle 35 Minuten in Selbstmord. Alle 120 Sekunden wird jemand verrückt. Zu den meisten Selbstmorden - und vermutlich auch zu vielen Geisteskrankheiten - wäre es nicht gekommen, wenn diese Menschen den Trost und Frieden gehabt hätten, die man in der Religion und im Gebet findet.\n\n«Seit dreißig Jahren habe ich eine Kliente aus allen Kulturländern der Erde. Viele Hunderte von Patienten sind durch meine Hände gegangen: Es waren in der Großzahl Protestanten, in der Minderzahl Juden und nicht mehr als fünf bis sechs praktizierende Katholiken.\nUnter allen meinen Patienten jenseits der Lebensmitte, das heißt jenseits fünfunddreißig, ist nicht ein einziger, dessen endgültiges Problem nicht das der religiösen Einstellung wäre.» - C.G. Jung -\n\nEin Mann mit Sorgen hat viel durchgemacht und begann zu beten. Daraufhin fiel ihm die Bibel auf dem Tisch auf und er las folgende Stelle der Bergpredigt: „Sorget nicht für euer Leben, was ihr essen und trinken werdet. Bedeutet das Leben nicht mehr als Essen und Trinken, und ist der Mensch nicht wichtiger als seine Kleidung? Seht euch die Vögel an! Sie säen nichts, sie ernten nichts und sammeln auch keine Vorräte. Euer Vater im Himmel versorgt sie. Meint ihr nicht, dass ihr ihm viel wichtiger seid?\n…Trachtet aber zuerst nach dem Reiche Gottes und nach seiner Gerechtigkeit, so wird euch solches alles zufallen.“\n- Matthäus ‭6‬:‭25‬-‭26 & 33 - ‬\n\nNachdem der Mann diese Stelle laß…\n\nWährend ich betete und jene Worte las, geschah ein Wunder.\nAlle Nervosität und Spannung fiel von mir ab. Meine Angst, meine Sorgen verwandelten sich in ein warmes Gefühl des Mutes, der Hoffnung und der Zuversicht.\nIch war glücklich, obwohl ich nicht einmal genug Geld besaß, um die Hotelrechnung zu bezahlen. Ich ging zu Bett und schlief tief - frei von allen Sorgen -, wie ich seit Jahren nicht mehr geschlafen hatte.\n\n«Am nächsten Vormittag war meine Lage äußerlich gesehen noch genau die gleiche, aber in mir waren umwälzende Dinge geschehen. Plötzlich war ich mir meiner Verbundenheit mit Gott bewusst geworden. Ein Mann allein kann leicht geschlagen werden, aber wenn die Kraft Gottes in ihm wirkt, ist er unbesiegsar. Ich weiß es, es ist mir selbst passiert.\nBittet, so wird euch gegeben; suchet, so werdet ihr finden; klopfet an, so wird euch aufgetan.»\n\n«Das Gebet ist die stärkste Form von Energie, die man erzeugen kann, so real wie die Schwerkraft. Als Arzt habe ich erlebt, dass Patienten durch die ruhige Kraft des Gebets von Krankheiten und Melancholie befreit wurden, wenn kein anderes Mittel mehr half... Das Gebet ist wie das Radium ein Quelle lichter, ständiger Energie… Im Gebet trachtet der Mensch danach, seine begrenzte Energie durch Hinwendung zum unendlichen Ursprung aller Energien zu vermehren. Wenn wir beten, verbinden wir uns mit der unerschöpflichen bewegenden Kraft, die das Universum dreht. Wir bitten, dass ein Stück dieser Kraft uns und unseren Bedürfnissen zugemessen wird. Schon durch das Bitten allein werden unsere menschlichen Schwächen von uns genommen, und wir erheben uns gestärkt und getröstet... Immer wenn wir uns Gott in innigem Gebet nähern, verändern sich Seele wie Körper zu ihrem Vorteil. Es ist unmöglich, dass irgendein Mann oder irgendeine Frau auch nur eine Sekunde betet, ohne eine positive Wirkung zu verspüren.»\n- Dr. Alexis Carrel -\n\nEin Mann in einer misslichen Lage betete und das passierte: Sobald ich meine Sorgen einer größeren Kraft als der meinen anvertraute, durchströmte mich ein Frieden, wie ich ihn seit Monaten nicht mehr erlebt hatte. Ich muss ungefähr eine halbe Stunde dort auf der Erde gesessen und geweint und gebetet haben. Dann fuhr ich nach Hause und schlief tief und ruhig.\nAm nächsten Morgen stand ich voll Zuversicht auf. Ich brauchte mich nicht mehr zu fürchten, weil ich Gott die Führung überlassen hatte.\n\n«Die stürmischen Wellen an der unruhigen Oberfläche lassen die Tiefen des Ozeans unberührt. Und dem, der an größeren und ewigen Wirklichkeiten Halt findet, erscheinen die häufigen Wechselfälle seines eigenen Schicksals relativ unwichtig. Der wahre religiöse Mensch ist deshalb nicht zu erschüttern und voll Gleichmut und nimmt gelassen alle Pflichten an, die der Tag ihm bringen mag.» - William James -\n\n«Herr, mach mich zu einem Instrument deines Friedens. Wo Hass ist, lass mich Liebe säen. Wo Unrecht ist, Vergebung. Wo Zweifel ist, Glaube. Wo Verzweiflung ist, Hoffnung. Wo Dunkelheit ist, Licht. Wo Trauer ist, Freude. O Herr, unser Gott, gib, dass ich nicht so sehr verlange, getröstet zu werden, als zu trösten; verstanden zu werden, als zu verstehen; geliebt zu werden, als zu lieben; denn im Geben empfangen wir, im Verzeihen wird uns verziehen, und im Sterben werden wir zum ewigen Leben geboren.»\n- Franziskus von Assisi -",

    "c": "Es gibt Menschen, die nichts falsch machen wollen und Menschen, die darüber nachdenken, was sie falsch gemacht haben und was sie daraus lernen können.\n\nH. P. Howell: «Nach dem Abendessen zog ich mich zurück, öffnete meinen Terminkalender und überdachte noch einmal alle Gespräche, Diskussionen und Treffen, die seit Montagvormittag stattgefunden hatten. Ich fragte mich dann: Was für Fehler habe ich gemacht? Was war richtig - und wo hätte ich meine Sache besser machen können? Was kann ich aus dieser Erfahrung lernen? Manchmal war so eine wöchentliche Rückschau sehr bedrückend, und manchmal staunte ich selbst über die Schnitzer, die mir passierten. Natürlich wurden sie mit den Jahren weniger. Diese Methode, sich über Jahre selbst zu analysieren, hat mir mehr gebracht als alles andere, was ich in dieser Richtung versuchte.»\n\nBenjamin Franklin nahm sich jede Woche eine schlechte Gewohnheit vor und änderte sie ab.\n\nDrei große Fehler: Zeit verschwenden, sich über Kleinigkeiten ärgern, mit Leuten streiten und ihnen widersprechen.\n\nFranklin kämpfte den wöchentlichen Kampf mit seinen Fehlern über zwei Jahre.\nKein Wunder, dass er einer der beliebtesten und einflussreichsten Männer wurde, die Amerika je besaß.\n\nElbert Hubbard sagte einmal: «Jeder Mensch ist mindestens fünf Minuten am Tag ein verdammter Idiot. Diese Grenze nicht zu überschreiten - das ist Weisheit.»\n\nDer kleine Mann gerät über die geringste Kritik in helle Wut, doch der kluge Mann ist begierig, von denen zu lernen, die ihn gemaßregelt und gescholten haben.\n\nEinstein, einer der größten Denker unserer Zeit, bekannte, dass er sich in neunundneunzig von hundert Fällen irre.\n\nWir können von viermal höchstens dreimal recht haben.\n\nWir alle haben die Neigung, Kritik abzulehnen und Lob gierig einzusaugen, ob sie gerechtfertigt sind oder nicht. Wir sind keine verstandesbetonten Geschöpfe. Wir sind gefühlsbetont. Unsere Logik gleicht einem Kanu aus Birkenrinde, das auf einem tiefen, dunklen, stürmischen Meer der Gefühle herumgeworfen wird.\n\nBeispiel von E. H. Little\n\n«Ich bin nicht noch einmal zurückgekommen, um Ihnen Seife zu verkaufen», sagte er, «ich wollte nur Ihren Rat hören und Ihre Kritik. Würden Sie mir bitte verraten, was ich eben falsch machte? Sie sind viel erfahrener und erfolgreicher als ich. Bitte, üben Sie Kritik. Seien Sie offen. Nehmen Sie kein Blatt vor den\nMund!»\n\nMit dieser Einstellung machte er sich viele Freunde, und erhielt viele unbezahlbare Ratschläge.\n\nFühren wir über die Dummheiten, die wir gemacht haben, Buch und analysieren wir sie. Da wir nicht vollkommen sein können, machen wir es wie E. H. Little: Bitten wir um sachliche, nützliche und aufbauende Kritik.",

    "c": "Ruhe dich aus, ehe du müde wirst.\n\nJeder Medizinstudent wird Ihnen sagen, dass Müdigkeit die körperliche Widerstandskraft Hunderte von Krankheiten verringert. Und jeder Psychiater wird Ihnen sagen, dass Müdigkeit auch Ihre Abwehr gegen Gefühle der Sorge und Angst vermindert. Wenn wir also verhindern, dass wir müde werden, beugen wir auch Sorgen und Angsten vor.\n\n«Bei völliger Entspannung ist Nervosität oder Erregtheit nicht möglich.»\n- Dr. Edmund Jacobson -\n\nWenn du dich entspannst, kannst du dich nicht mehr sorgen und ängstigen.\n\nRuhe dich häufig aus. Ruhen dich aus, ehe du müde wirst.\n\nDie Armee der Vereinigten Staaten hat durch wiederholte Tests festgestellt, dass sogar junge Männer - Männer, die durch jahrelange militärische Ausbildung abgehärtet waren - besser marschierten und länger durchhielten, wenn sie jede Stunde ihre Ausrüstung zehn Minuten ablegen und sich ausruhen konnten.\n\nDr. Walter B. Cannon von der Harvard-Universität erklärt es so: «Die meisten Menschen haben die Vorstellung, dass das Herz ständig arbeitet. Bei einem Durchschnitt von 70 Pulsschlägen in der Minute arbeitet es aber in Wirklichkeit nur neun von 24 Stunden. Alle Herzpausen zusammengerechnet ergeben eine Summe von vollen 15 Stunden täglich.»\n\nWährend des Zweiten Weltkriegs konnte Winston Churchill noch mit Ende sechzig und Anfang siebzig 16 Stunden am Tag arbeiten, und das jahrelang, und die Geschicke des Britischen Empire lenken. Ein unerhörter Rekord. Sein Geheimnis? Morgens arbeitete er bis elf Uhr im Bett, las Berichte, diktierte An-weisungen, telefonierte und hielt wichtige Konferenzen ab.\n\nNach dem Mittagessen legte er sich wieder hin und schlief eine Stunde. Am Abend ging er wieder ins Bett und schlief zwei Stunden, ehe er um acht Uhr zu Abend aß. Er heilte seine Müdigkeit nicht. Das war nicht notwendig. Er kam ihr zuvor. Durch seine häufigen Ruhepausen konnte er immer weiterarbeiten, munter und geistig fit, bis lange nach Mitternacht.\n\n«Ruhe ist nicht eine Sache des absoluten Nichtstuns. Ruhen heißt regenerieren.»\n- Daniel W. Josselyn -\n\nSollten Sie mittags kein Schläfchen machen können, legen Sie sich wenigstens vor dem Abendessen eine Stunde hin. Es ist billiger als ein Cocktail und auf die Dauer geschen 5467-mal wirksamer. Eine Stunde Schlaf um fünf, sechs oder sieben Uhr abends, und Sie können eine Stunde am Tag länger wach bleiben.\nWie? Warum? Weil eine Stunde Schlaf vor dem Abendessen und sechs Stunden Nachtschlaf - also zusammen sieben Stunden - Ihnen besser tun als acht Stunden Schlaf hintereinander.\n\nEin Mensch, der körperlich arbeitet, leistet mehr, wenn er sich mehr Zeit zum Ausruhen nimmt. Frederick Taylor wies dies nach, während er als Ingenieur des wissenschaftlichen Managements bei der Bethlehem Steel Company arbeitete. Er stellte fest, das jeder Arbeiter am Tag zwölfeinhalb Tonnen Roheisen auf die Frachtloren verlud und mittags erschöpft war. Ermachrecite wissenschaftliche Studie aller hineinspielenden Müdigkeitsfaktoren und erklärte, dass die Arbeiter nicht zwölfeinhalb Tonne an Ing verladen müssten, sondern siebenundvierzig! Er hatte ausgerechnet, dass sie fast das Vierfache leisten könnten, ohne erschöpft zu sein. Aber er musste es auch beweisen.\n\nTaylor wählte einen Mann namens Schmidt aus, der genau nach der Stoppuhr arbeiten sollte. Der Mann, der auf Schmid aufpassen sollte, befahl ihm also: «Jetzt das Eisen aufnehmen und gehen... jetzt hinsetzen und ausruhen ... jetzt gehen ... jetzt ausruhen.»\nWas geschah? Schmidt schaffte siebenundvierzig Tonnen Eisen täglich, während die anderen Arbeiter es nur auf zwölfeinhalb Tonnen pro Mann brachten. Während der drei Jahre, die Frederick Taylor bei Bethlehem Steel war, arbeitete Schmidt immer in diesem Rhythmus. Er konnte dies tun, weil er sich ausruhte, ehe er ermüdete. Er arbeitete ungefähr 26 Minuten in der Stunde und ruhte sich 34 Minuten aus. Er ruhte sich mehr aus, als er arbeitete - und trotzdem leistete er viermal so viel wie die andern!",

    "c": "Sich über Schlaflosigkeit Sorgen zu machen, schadet viel mehr als die Schlaflosigkeit selbst.\n\n«Mein jahrelanger Umgang mit Patienten hat mir gezeigt», sagte er, «dass eines der besten Schlafmittel das Gebet ist. Ich stelle dies nur in meiner Eigenschaft als Mediziner fest. Für die Menschen, die regelmäßig ein Gebet sprechen, ist es das beste und einfachste aller Beruhigungsmittel. Es besänftigt Geist und Nerven. Überlass alles Gott - lass los!»\n- Dr. Thomas Hyslop -\n\nWenn wir müde genug sind, zwingt uns die Natur zu schlafen, selbst wenn wir noch auf den Beinen sind.\n\nWorte seien der Schlüssel zu den verschiedensten Arten von Hypnose. Und wenn Sie ständig unter Schlafstörungen litten, sei die Ursache darin zu suchen, dass Sie sie sich einredeten. Man müsse sich also selbst wieder aus der Hypnose aufwecken - am besten, indem man zu den Muskeln seines Körpers spreche. «Lasst los, lasst los - lockert euch und entspannt euch.» Wir wissen bereits, dass Kopf und Nerven nicht entspannen können, wenn die Muskeln angespannt sind. Wenn Sie also schlafen möchten, müssen wir mit den Muskeln anfangen.\n- Körperübungen von Dr. David Harold Fink\n\nEines der besten Mittel gegen Schlafstörungenist körperliche Anstrengung: Gartenarbeit, Schwimmen, Tennis, Golf, Stiche on oder einfach Schwerarbeit.\n\nHier ein Beispiel:\n\nTheodore Dreiser glaubte dies wich. Alsjunger, ehrgeiziger Autor machte er sich so viel Sorgen wegen seiner Schlaflosigkeit, dass er sich einen Job als Strecken sbeiter bei der New Yorker Bahn suchte. Und nach einem Tag Bolzen einschlagen und Schotter schaufeln war er so ausge-pumpt, dass er beim Essen beinahe eingeschlafen wäre.\n\n1. Wenn Sie nicht schlafen können, machen Sie es wie Samuel Untermyer. Stehen Sie auf und arbeiten oder lesen Sie, bis Sie sich schläfrig fühlen.\n2. Vergessen Sie nicht: Kein Mensch starb je an Schlafmangel. Sorgen über Schlaflosigkeit richten gewöhnlich viel mehr Schaden an als die Schlaflosigkeit selbst.\n3. Versuchen Sie zu beten - oder sprechen Sie den dreiundzwanzigsten Psalm.\n4. Entspannen Sie sich körperlich.\n5. Arbeiten Sie sich aus. Machen Sie sich so müde, dass Sie nicht wach bleiben können.\n\n(Siehe zum Thema Sorgen und Schlaflosigkeit die Geschichte auf Seite 320)",

    "t": "Das Leben in Tageseinheiten",
    "c": "«Unsere Hauptaufgabe ist nicht, zu sehen, was in vager Ferne liegt, sondern nur das zu tun, was das Nächstliegende\nist.» - Sir William Osler -\n\n«Nun ist jeder von Ihnen aber eine noch weit erstaunlichere Schöpfung als dieser Ozeandampfer», sagte Dr. Osler zu jenen Yale-Studenten, «und auf einer viel längeren Reise unter-wegs. Ich habe daher die dringende Bitte an Sie, die Beherrschung dieses Mechanismus zu lernen, das heißt in Tageseinhei-ten zu leben, weil dies die beste Methode ist, sicher zu reisen.\nGehen Sie auf die Brücke und sorgen Sie dafür, dass wenigstens die wichtigsten Schotten richtig schließen. Drücken Sie auf den Knopf und hören Sie, wie auf jeder Ebene Ihres Lebens die eisernen Türen die Vergangenheit abschließen - das tote Gestern.\nDrücken Sie auf einen andern Knopf und verriegeln Sie mit einem eisernen Vorhang die Zukunft - das ungeborene Morgen.\nDann sind Sie sicher - für heute sicher! Schließen Sie die Vergangenheit weg! Lassen Sie die tote Vergangenheit ihre Toten begraben ... Denken Sie nicht mehr an das Gestern, das Dummköpten den Weg allen Staubes wies ... Wenn die Bürde von morgen mit der von gestern heute getragen werden muss, wankt auch der Stärkste... Verbannen Sie auch die Zukunft aus Ihrem Leben, so endgültig wie die Vergangenheit ... Die Zukunft ist heute... Es gibt kein Morgen. Der Rettungsanker ist das Heute. Energiever-schwendung, Depressionen, nervöse Ängste bedrängen den Menschen, der sich um seine Zukunft Sorgen macht ... Schließen Sie also die Schotten vorn und achtern und gewöhnen Sie sich an, Ihr Leben in ‹Tageseinheiten» zu planen.»\n\nGewöhnen Sie sich an, Ihr Leben in «Tageseinheiten» zu planen.\n\n„… dass man sich auf seine Zukunft am besten vorbereite, wenn man sich mit seiner ganzen Intelligenz und Begeisterung darauf konzentriere, die Arbeit von heute auch heute ganz vorzüglich zu leisten.“\n\nSir William Osler bat die Studenten, den Tag mit der Bitte des Vaterunsers «Und gib uns unser täglich Brot» zu beginnen.\n\nVergessen Sie nicht, dass in diesem Gebet nur um das tägliche Brot gebeten wird. Es enthält keine Klage über das alte Brot, das wir gestern essen mussten. Und es heißt in ihm auch nicht: «O Gott, es hat schon lange nicht mehr geregnet, vielleicht kommt eine neue Dürre - woher werde ich im Herbst mein Brot nehmen\n- vielleicht verliere ich meine Arbeit - o Gott, wie kann ich dann Brot kaufen?»\nNein, dieses Gebet lehrt uns, nur um das tägliche Brot zu bit-Ten. Das tägliche Brot ist die einzige Art von Brot, die wir essen\nkönnen.\n\n«Darum sorget nicht für den anderen Morgen; denn der morgende Tag wird für das Seine sorgen. Es ist genug, dass ein jeglicher Tag seine eigene Plage habe.»\n\n„Ich kann meine Zeit viel besser nützen, wenn ich über künftige Probleme nachdenke und nicht über die von gestern nachgrüble.“\n- Admiral King -\n\n‹Ted›, sagte er, «stellen Sie sich Ihr Leben einmal wie eine Sanduhr vor! Sie wissen, dass sich Hunderte von Sandkörnern im oberen Teil befinden und sie alle langsam und gleichmäßig durch den engen Hals in der Mitte rinnen. Nichts, was Sie oder ich tun, kann verhindern, dass ein Sandkorn nach dem anderen hindurchgleitet - außer Sie machen die Sanduhr kaputt. Sie und ich und alle Menschen sind wie diese Sanduhr. Morgens, wenn wir aufwachen, haben wir das Gefühl Hunderte von Dingen an diesem Tag erledigen zu müssen, doch wenn wir nicht eins nach dem andern tun, langsam und gleichmäßig, so wie die Körner durch die Sanduhr rinnen, dann werden wir irgendwann körperlich und geistig zusammenbrechen»\n\nSie und ich, wir stehen genau in dieser Sekunde an der Nahtstelle zweier Ewigkeiten: die weite Vergangenheit, die ewig andauert, und die Zukunft, die sich bis zum letzten Hauch der messbaren Zeit ausdehnt. Wir können unmöglich in einer dieser Welten leben - nein, nicht einmal für den Bruchteil einer Sekunde. Und wenn wir es dennoch versuchen, können wir sowohl unseren Körper wie unseren Verstand zerstören. Also begnügen wir uns damit, den Zeitraum zu leben, den wir tatsächlich leben können: von jetzt bis zum Schlafengehen.\n\nGlücklich der Mensch, glücklich er allein, Der das Heute ganz besitzen kann.\nDer in sich ruhend sagen kann:\n«Das Morgen, sei es noch so schlimm, Ich habe heut gelebt.»\n- Dichter Horaz -\n\nWir alle träumen von einem verzauberten Rosengarten hinter dem Horizont - statt uns über die Rosen zu freuen, die heute vor unserem Fenster blühen.\n\nEine der tragischsten Eigenschaften der menschlichen Natur ist der Hang, das Leben aufzuschieben.\n\n«Wie seltsam er doch ist, der Lauf unseres kleinen Lebens», schrieb der kanadische Schriftsteller Stephen Leacock. «Das kleine Kind sagt: ‹Wenn ich ein großer Junge bin. Aber was heißt das? Der große Junge sagt: Wenn ich erwachsen bin. Und dann, wenn er erwachsen ist, sagt er: ‹Wenn ich verheiratet bin! Doch was ist schließlich an einer Ehe schon viel dran? Seine Gedanken ändern sich, er sagt: ‹Wenn ich nicht mehr arbeiten muss.› Und dann, wenn er alt geworden und diese Zeit gekommen ist, blickt er zurück über das Land, das er durchwandert hat. Ein kalter Wind scheint darüber hinwegzuwehen. Irgendwie hat er alles verpasst, und nun ist es vorbei. Das Leben, erkennen wir zu spät, muss gelebt werden, in jedem Augenblick des Tages und der Stunde.»\n\nSie werden sich sicherlich erinnern, was die Weiße Königin zu Alice sagte: «In der Regel gibt es morgen Marmelade, und gestern gab es welche, bloß heute gibt es nie Marmelade.» Die meisten von uns sind so - sie ärgern sich über die Marmelade von gestern oder machen sich wegen der von morgen Sorgen, statt sie heute dick aufs Brot zu streichen.\n\n«Das ist der Tag, den der Herr macht, Lasset uns uns freuen und fröhlich darinnen sein.»\n- 118. Psalm -\n\nDas Heute ist unser kostbarster Besitz. Das Einzige, was wir ganz sicher besitzen.\n\nGruß an die Morgendämmerung\n\nSieh diesen Tag!\nDenn er ist Leben, ja das Leben selbst.\nIn seinem kurzen Lauf\nLiegt alle Wahrheit, alles Wesen deines Seins:\nDie Seligkeit zu wachsen, Die Freude zu handeln, Die Pracht der Schönheit, Denn gestern ist nur noch ein Traum, Und morgen ist nur ein Bild der Phantasie, Doch heute, richtig gelebt, verwandelt jedes Gestern\nIn einen glückseligen Traum\nUnd jedes Morgen in ein Bild der Hoffnung.\nSo sieh denn diesen Tag genau!\nDas ist der Gruß der Morgendämmerung.\n\n- indischer Dramatiker Kalidasa -",

    "c": "Es gibt keine richtigen Entscheidungen.\n\nWer Fehler finden will, findet sie auch im Paradies. - Henry Thoreau -\n\nHier ist die Zen-Geschichte von einem Bauer und seinem Pferd in Kurzfassung:\n\nEin Bauer hatte ein wertvolles Pferd, das ihm weglief. Die Nachbarn kamen und sagten: “Wie schrecklich!” Der Bauer antwortete nur: “Wir werden sehen.” Einige Tage später kam das Pferd zurück und brachte wilde Pferde mit. Die Nachbarn sagten: “Wie wunderbar!” Der Bauer antwortete: “Wir werden sehen.” Später brach sich der Sohn des Bauern das Bein, als er versuchte, ein wildes Pferd zu reiten. Die Nachbarn sagten: “Wie schrecklich!” Der Bauer antwortete: “Wir werden sehen.” Kurz darauf kam die Armee und rekrutierte alle jungen Männer für den Krieg, außer dem Sohn des Bauern wegen seines gebrochenen Beins. Die Nachbarn sagten: “Wie wunderbar!” Der Bauer antwortete wieder: “Wir werden sehen.”\n\nDie Geschichte lehrt, dass es oft schwierig ist, sofort zu beurteilen, ob ein Ereignis gut oder schlecht ist, da sich die Umstände ständig ändern.\n\nDas Leben kann nur in der Schau nach rückwärts verstanden, aber nur in der Schau nach vorwärts gelebt werden.\n- Søren Kierkegard -\n\nDa das Leben nur rückblickend verstanden werden kann, aber nach vorne blickend gelebt werden muss, können wir keine richtigen oder falschen Entscheidungen treffen - immer nur Entscheidungen. Alles andere ist eine Frage der Perspektive. Erst die Zeit wird es zeigen. Mach in der nächsten Entscheidungssituation, in der du dich befindest, einmal den Test: Befürchtest du, du könntest eine falsche statt eine richtige Entscheidung treffen, dann steig für einen Moment aus, setz deine Fuzzi-Brille ab, und schnell wirst du ein Einsehen haben.",

    "c": "Neben der Illusion, Glück könne von Dauer sein, besteht ein weiterer Denkfehler darin, zu glauben, wir könnten die Polarität irgendwie zu unseren Gunsten austricksen oder verbessern, indem wir die Sonnenphasen so weit wie möglich ausdehnen. Aber es ist Selbstbetrug zu meinen, das black and white game des Lebens gewinnen zu können.\nKein Berater, kein Lebenshilfebuch, kein Coach kann dir das Auf und Ab des Lebens ersparen. Sie können dich nur anleiten, es intelligent zu leben, indem sie dir beibringen, auch das Schlechte gelassen zu akzeptieren.\n\nWahre Freude gibt es nur im Doppelpack mit Leid. Phasen der Lust kann man nicht verlängern, indem man Schmerz vermeidet. Nach dem Polaritätsgesetz würde dies ja bedeuten, es dürfte keine Täler mehr geben, sondern nur noch Berge. Keine Nacht mehr, sondern nur noch Tag.\nUnd auch keinen Regen mehr, da ja nur noch die Sonnenseite des Lebens angesagt ist. Doch das ist ein Hirngespinst: Es gibt keinen Berg ohne Tal, keine Sonne ohne Wolken. Die Araber haben dafür eine wunderschöne Weisheit: »Immer nur Sonne macht die Wüste. « Dennoch verdrängen wir Menschen die Realität.\n\nEin beeindruckendes Beispiel beschreibt Harald Willenbrock in seinem GEO-Artikel Das Geheimnis der guten Wahl: Hierin schildert er das Leben des Hirtenvolkes der Moro, das am Rande der Sahelzone ums nackte Überleben kämpfte - bis eines Tages deutsche Entwicklungshelfer ihr Schicksal in die Hände nahmen.\nEs wurden Brunnen gebohrt, die Tsetsefliegen-Population und damit auch die Schlafkrankheit bei Rindern bekämpft.\nEin Gesundheitsdienst sorgte für eine deutliche Verbesserung der Lebenssituation der Menschen.\nZwanzig Jahre später war die Lage der Moros schlimmer als je zuvor. Wie war das möglich? Da sich die Rinderpopulation aufgrund der Bekämpfung der Tsetsefliege erhöht hatte und auch die Sterblichkeitsrate der Moros selbst gesunken war, reichte das Wasser aus den Brunnen irgendwann nicht mehr für Menschen und Tiere. Und als die viel zu große Anzahl an Rindern das letzte Fleckchen Weidegrün abgegrast hatte, folgte eine Hungerkatastrophe, die verheerender war als alle vorangegangenen.\nErst am Ende seiner Beschreibung löst Willenbrock auf, dass der Fall Moro frei erfunden ist »und nur als Computersimulation auf den Rechnern des Instituts für Theoretische Psychologie der Universität Bamberg existiert. Dort stellen Forscher seit mehr als 30 Jahren mit Aufgaben wie dem\n›Moroland-Szenario‹ Entscheidungskompetenzen von Managern, Unternehmensberatern und Studenten auf die Probe.« Mir geht es bei diesem Beispiel vor allem darum, zu zeigen, was immer wir auch Gutes im Schilde führen, über eines müssen wir uns im Klaren sein: Wir werden dieses Gute niemals ohne seine Schattenseiten erleben.",

    "t": "Auch dies geht irgendwann vorbei",
    "c": "Die Ereignisse völlig neutral zu betrachten und zu versuchen, beide Pole zuzulassen, ist nicht leicht - aber auch nicht schwer. Vor allem ist es wiederum eine Gelegenheit, sich in heiterer Gelassenheit zu üben.\n\nBleibt die Frage: Was tue ich, wenn ich einmal ganz am Ende bin? Hierzu folgende Geschichte: Der König eines reichen Landes empfand sich als vom Glück gesegnet, machte sich allerdings Sorgen um den Tag, an dem es ihm einmal nicht mehr so gut gehen würde. Er rief die Weisen seines Hofes zu sich und erbat einen Rat für diesen Tag, der kleingeschrieben auf einem Zettel unter seinen Siegelring passte, sodass er ihn stets bei sich tragen konnte. Die Gelehrten zogen sich zurück und berieten tagelang - vergeblich. »Lieber König«, sagten sie, »es können so viele schreckliche Dinge passieren, all die Ratschläge passen nicht unter deinen Sie-gering. Wir können dir nicht helfen, wohl aber ein alter weiser Mann, der fern in den Wäldern deines Reiches wohnt.\nWundersame Dinge erzählt man über ihn.«\nDer König dachte, das ist es mir wert, und ritt hinaus ins Land. Er fand den alten Weisen und trug ihm sein Anliegen vor. Lächelnd schrieb der Alte nur wenige Worte auf einen Zettel, faltete ihn und schob ihn dem König unter den Siegering. Glücklich ritt der König zurück auf sein Schloss.\nJahre vergingen, und eines Tages machte sein jüngerer Bruder ihm den Thron streitig. Der König musste fliehen, Stunden dauerte die Jagd, bis sie für den König schließlich in einer Schlucht endete. Vor ihm ein Abgrund, rechts und links steile Wände, hinter ihm die Verfolger. Da dachte der König:\nJetzt ist alles vorbei. Er erinnerte sich aber an den Rat unter seinem Siegelring, und erstmals zog er den Zettel hervor.\nDarauf geschrieben standen nur vier Worte: » Auch dies wird vorübergehen.« Mein Gott, dachte der König, in einer solchen Situation? Da merkte er aber, wie sich das Hufgetrap pel in der Schlucht immer mehr entfernte. Die Verfolger hatten die Spur verloren. Der König ritt zurück, sammelte all seine versprengten Soldaten in den Wäldern wieder ein und eroberte tags darauf das Schloss zurück. Er war wieder ganz obenauf. Ließ sich in seiner goldenen Kutsche durch die Stadt fahren und feiern. Da ging der alte Weise neben der Kutsche einher und rief dem König zu: »Schaue auch in diesem Moment auf den Zettel.«\nDer König dachte, was soll's, mir geht es gut. Aber noch einmal las er: » Auch dies wird vorübergehen.« Da erst hatte er den weisen Rat verstanden.\nGleichgültig, ob du im Leben oben oder unten bist, vergiss nie: Auch dies wird vorübergehen.",

    "c": "Alles, was dich wirklich berührt, wirst du nie beeinflussen können. Geburt und Tod, leben, wachsen und sterben. Und genau deshalb raten uns die wirklich weisen Menschen: Akzeptiere, was ist. Lass es zu, löse dich von deinem Machbarkeitswahn, damit du nicht erpressbar bist, befreie dich von der Verschleierung der Realität durch dein Ego, das meint, alles bestimmen zu können.\nDie Weisen und Glücklichen unter uns schaffen es immer mal wieder für eine gewisse Zeit, ihr Ego abzuschalten. Denn die wahren Glücksmomente im Leben finden ohne Ego statt. Sie bestehen auch nicht in der Erfüllung von Wünschen.\nWirklich zufrieden sind wir nur, wenn wir uns von all den Wünschen lösen, die uns vor sich hertreiben. Deshalb definiere ich Glück als die Fähigkeit, das Leben so zu akzeptieren, wie es sich uns präsentiert. Und etwas anderes, so zeigt uns das Bild vom Fluss des Lebens, bleibt uns auch gar nicht übrig. Es kommt, wie es kommen soll.\n\nMaktub!",

    "t": "Der Strudel",
    "c": "Mit der Angst ist es wie bei einem Strudel: Der Weg aus der Angst führt nicht an ihr vorbei, sondern nur durch sie hindurch.\n\nDen Umgang mit Angst möchte ich dir noch einmal anders verdeutlichen, und zwar an einer Geschichte, die ich selbst erlebt habe und die ein eindrückliches Bild darstellt: Wieder einmal leitete ich ein Seminar in Brasilien. Nach beendetem Tagesprogramm war ich mit einem Seminarteilnehmer auf-gebrochen, um den Strand entlangzulaufen und schwimmen zu gehen. Nach einer Weile kamen wir an eine Stelle, an der ein Fluss ins Meer mündete. Es handelte sich um einen brei ten Zufluss, das Wasser strömte sehr schnell in den Ozean.\nDoch alles, was ich sah, war, dass der Strand auf der anderen Seite des Flusses einfach paradiesisch aussah. Okay, da willst du hin, dachte ich und machte mich daran, einen Einheimischen zu fragen, wie wir ans andere Ufer gelangen konnten. Der freundliche Zeitgenosse wies ins Landesinnere und erklärte, in etwa zwei Meilen käme eine Brücke, die über den Fluss führe. Nee, Dieter, sagte ich mir, darauf hast du ja nun gar keine Lust: zwei Meilen zur Brücke, zwei Meilen von der Brücke zu dem leeren Strand und dann das gleiche Programm noch mal rückwärts? Nach Adam Riese also insgesamt acht Meilen zu laufen? Nicht mit mir.\nSchon war ich drauf und dran, ins Wasser zu steigen.\nDoch der Mann hielt uns zurück. Er wies auf die Mitte des Flusses, und als ich seiner Hand folgte, sah ich sie: Im Wasser bildeten sich gewaltige Strudel. » Es ist zu gefährlich!«, sagte er. »Selbst die besten Schwimmer aus unserer Gegend meiden diese Stelle. « Doch ich, einmal vom Paradiesstrand an-gelockt, hatte nichts Besseres zu tun, als abzuwinken: » Nee, nee, lass mal, ich bin ein guter Schwimmer, ich gehe da jetzt rein. « Welche Hybris!\nIch watete vom flachen ins tiefere Flusswasser und begann zu schwimmen. Mein Begleiter wollte mir folgen, wurde aber, glücklicherweise muss man sagen, von dem Einheimischen zurückgehalten. Natürlich war mir nicht im Geringsten danach zu sterben, ich hatte mir einen tollen Plan zu-rechtgelegt: Ich wollte mich vom Strudel erfassen und um die Hälfte herumtragen lassen, um dann auf der anderen Seite aus ihm heraus ans gegenüberliegende Ufer zu schwimmen.\nGesagt, getan. Doch als es losging und ich von der Strömung erfasst wurde, begriff ich sehr schnell, wie sehr ich mich überschätzt hatte. Ich bin ein wirklich guter Schwimmer und war auch sehr zügig unterwegs, aber gegen diese Kräfte war kein Ankommen. Ich schwamm nur noch im Kreis, an ein Aussteigen nach der Hälfte war nicht mehr zu denken. Der Strudel zog mich unweigerlich mit sich, erst immer weiter in die Mitte, dann erbarmungslos in die Tiefe.\nWas mich rettete, war eine Lektion meines Vaters, die mir plötzlich wieder in den Sinn kam. » Wenn du von einem Strudel mitgerissen wirst«, hatte er mir als Kind einmal erklärt,\n»kannst du dich nur retten, indem du erstens Ruhe bewahrst und zweitens zulässt, was geschieht. Und zwar so lange, bis der Strudel dich ganz nach unten auf den Grund gezogen hat.\nGanz, ganz unten lässt der Sog nach, dort kannst du heraus-schwimmen. Gegen den Strudel anzukämpfen, macht überhaupt keinen Sinn. Du verlierst nur wertvolle Kraft und kannst ihm doch nicht entkommen. Er wirbelt dich erst herum und zieht dich dann nach unten. Verwende deine Energie lieber darauf durchzuhalten, bis du unten ankommst, um dann herauszuschwimmen, wenn es so weit ist. Vertraue darauf, dass dieser Moment kommen wird.«\nWoher mein Vater das wusste? Er hatte diese Erfahrung selbst gemacht - in der Kriegsgefangenschaft. Als Gefangener musste er in der Save bei Belgrad Brücken bauen. Bei dieser Arbeit schwamm er auch zwangsläufig viel im Fluss, und im-mer, wenn die Save sehr viel Wasser trug, kam es an der einen oder anderen Stelle zu gefährlichen Strömungen und zur Stru-delbildung. Einheimische hatten meinem Vater verraten, wie man sich zu verhalten hat, wenn man in einen Strudel gerät, und er hatte dieses Wissen an mich weitergegeben.\nAn jenem Tag folgte auch ich diesem Rat, so gut ich konnte, und schaffte es tatsächlich, mich aus dem Strudel zu befreien und ans andere Ufer zu gelangen. Muss ich dir noch sagen, lieber Leser, was ich danach tat? Mit Freuden ging ich erst die zwei Meilen zur Brücke und dann noch mal zwei Meilen zurück zu meinem Ausgangspunkt. Es war der herrlichste Spaziergang meines Lebens. Dieses Experiment würde ich ganz sicher nie wiederholen!\n\nBis heute ist mir diese Geschichte in Erinnerung geblieben und dient mir als Bild, sowohl in Bezug auf Angst als auch in einem übergeordneten Sinne zum Thema Akzeptanz.",

    "t": "Akzeptanz der Angst",
    "c": "Angst zu akzeptieren, fällt schwer. Dabei kann die Erkenntnis, dass kein Ereignis dazu bestimmt ist, einem Angst zu machen, sondern wir nur mit Angst auf ein Ereignis reagieren, sehr befreiend sein. Fast so befreiend wie die Einsicht, dass das Glück immer schon in uns ist und uns durch eine gelassenere Haltung zuteilwird. Die Spitzennachricht lautet ja wie folgt: In dem Moment, in dem wir unsere Angst akzeptieren, löst sie sich bereits auf.\n\nProbiere es einmal selbst aus. Wenn du spürst, dass die Angst vor dem nächsten Meeting oder Personalgespräch im Anmarsch ist, mach dir Folgendes klar: Sie kommt nicht vom Ereignis, sondern von deiner Erwartung (oder Befürchtung), nicht so erfolgreich zu sein, wie du es gern möchtest. Was hilft? Atme einfach nur tief ein und aus und mach in deinem Brustkorb Platz für die Angst. Lade sie ein. Mehr als da sein kann sie nicht. Aber du wirst sehen, in dem Moment, in dem du sie dir bewusst machst, wird dieses ungute Gefühl, dieses diffuse Unwohlsein auch verschwinden. Vielleicht klappt es nicht gleich. Es kommt sehr darauf an, wie lange du dich schon mit deiner Angst herumschlägst. Aber wenn du deine Wahrnehmung lang genug trainierst, wird sich der Erfolg einstellen.\n\nSo kann es mit jedem Gefühl gehen, dem wir ohne Wertung gegenüberstehen. In dem Augenblick, in dem du Widerstand leistest oder die Angst verdrängst, wird sie größer werden. Wenn du sie aber zulässt und dir klarmachst, dass es sich hierbei lediglich um eine Form von Energie handelt, löst sie sich auf - und der Strudel gibt dich frei.",

    "t": "Wunder und ihre Grenzen",
    "c": "»Da der Yogi angeblich Gegenstände aus dem Äther materialisieren konnte, fragte ich lachend, ob er uns auch außerhalb der Jahreszeit Mandarinen beschaffen könnte. Sofort blähten sich die Luchis, die auf allen Bananenblatt-Tellern lagen, auf, und wir fanden in jeder der Teighüllen eine geschälte Mandarine. Ich biss etwas ängstlich in meine hinein, doch sie schmeckte köstlich.« Jahre später erfuhr ich durch eigene Verwirklichung, wie Gandha Baba diese Materialisationen zustande brachte. Die Methode ist für die hungernden Menschenmassen dieser Welt leider nicht erlernbar. Die verschiedenen Sinnesreize, auf die der Mensch reagiert, die des Tastsinns, Geschmacks, Gesichts, Gehörs und Geruchs, werden durch die verschiedenen Schwingungen der Elektronen und Protonen hervorgerufen. Diese Schwingungen wiederum werden durch Prana (Biotronen) reguliert, d. h. durch subtile Lebenskräfte oder Energien, die feiner als Atome sind und als »Intelligenzträger« gelten können, denn sie enthalten die jeweiligen Ideensubstanzen der fünf Sinne. Gandha Baba, der sich durch bestimmte Yoga-Übungen mit der pranischen Kraft in Verbindung setzen konnte, besaß die Fähigkeit, die Schwingungsstruktur der Biotronen so zu verändern, dass diese das gewünschte Resultat hervorbrachten. Seine Parfüms, Früchte und anderen Gegenstände waren tatsächliche Materialisationen, d. h. Verdichtungen irdischer Schwingungen, und keine durch Hypnose hervorgerufenen Wahrnehmungen. Ärzte machen von der Hypnose, einer Art geistigen Chloroforms, Gebrauch, wenn der Patient durch andere Betäubungsmittel gefährdet scheint und es sich nur um kleinere Operationen handelt. Wer sich jedoch oft der Hypnose unterzieht, kann durch die negative psychologische Wirkung, die sie hervorruft, Schaden leiden; mit der Zeit können sogar seine Gehirnzellen zerrüttet werden. Die Hypnose bedeutet ein Eindringen in die Bewusstseinssphäre eines anderen Menschen. Ihre vorübergehenden Wirkungen haben nichts mit den Wundern gemein, die von Menschen mit göttlicher Verwirklichung vollbracht werden. Wahre Heilige, die in Gott erwacht sind, können durch ihren Willen, der sich in Harmonie mit dem Willen des Kosmischen Traumschöpfers befindet, tatsächliche Veränderungen in dieser Traumwelt bewirken. Wundertaten, wie sie der »Parfüm-Heilige« vollbrachte, sind zwar aufsehenerregend, aber vom geistigen Standpunkt aus wertlos. Da sie kaum einen anderen Zweck als den der Unterhaltung erfüllen, lenken sie nur von der ernsthaften Suche nach Gott ab. Das Zurschaustellen übernatürlicher Kräfte wird von den Meistern verurteilt. Der persische Mystiker Abu Said lachte einst über gewisse Fakire, die stolz darauf waren, auf dem Wasser wandeln, in der Luft schweben und jede beliebige Entfernung überbrücken zu können. »Auch ein Frosch ist im Wasser zu Hause«, bemerkte Abu Said mit gutmütigem Spott. »Auch die Krähe und der Aasgeier fliegen mit Leichtigkeit durch die Luft. Und der Teufel ist gleichzeitig in Ost und West gegenwärtig. Nur derjenige ist ein wahrer Mensch, der gegen jedermann gerecht ist, ruhig seinen Geschäften nachgeht und Gott dabei keinen Augenblick vergisst.«",

let REFLECTIONS = [];
let results = [], idx = 0, favs = [], soundOn = true, showFavView = false;
let activeMain = 'all', activeSub = 'all', toastTimer;

function init() {
  favs = JSON.parse(localStorage.getItem('sk-favs') || '[]').map(String);
  soundOn = localStorage.getItem('sk-sound') !== 'false';

  updateSndBtn();
  updateFavBtn();
  REFLECTIONS = CARDS.map(normalizeCard);
  renderMainSegments();
  renderCats();
  renderBgCards();
  renderCurrentView();

  const inp = document.getElementById('q');
  if (inp) inp.addEventListener('input', debounce(doSearch, 180));
  window.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      toggleSearch();
    }
    if (e.key === 'Escape') closeCardModal();
  });
}

function debounce(fn, ms) {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  })[ch]);
}

function jsArg(value) {
  return `'${String(value ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/</g, '\\u003c')}'`;
}

function normalizeCard(card) {
  const mainCategory = getCardMain(card);
  return {
    id: String(card.id),
    mainCategory: card.mainCategory || mainCategory,
    subCategory: card.subCategory || card.t,
    title: card.t,
    question: card.q || '',
    advice: card.c || '',
    source: card.source || '',
    type: getCardType(card),
    icon: card.icon || categoryIcon(card.mainCategory || mainCategory),
    k: card.k || [],
  };
}

function getCardType(card) {
  const text = `${card.t} ${card.c}`;
  return (TYPE_RULES.find(([rule]) => rule.test(text)) || [null, 'Impuls'])[1];
}

function categoryIcon(id) {
  return (MAIN_CATEGORIES.find(cat => cat.id === id) || MAIN_CATEGORIES[0]).icon;
}

function toggleSearch() {
  const shell = document.getElementById('topSearch');
  const input = document.getElementById('q');
  shell.classList.toggle('open');
  if (shell.classList.contains('open')) {
    setTimeout(() => input.focus(), 180);
  } else {
    input.blur();
  }
}

function closeSearch() {
  const shell = document.getElementById('topSearch');
  const input = document.getElementById('q');
  shell.classList.remove('open');
  input.value = '';
  input.blur();
  renderCurrentView();
}

// ─────────────────────────────────────────────
// SEARCH
// ─────────────────────────────────────────────
function doSearch() {
  if (!document.getElementById('q')) return;
  const q = (document.getElementById('q')?.value || '').trim().toLowerCase();
  showFavView = false;
  if (!q) { renderCurrentView(); return; }

  const scored = REFLECTIONS.map(card => {
    let s = 0;
    const tl = card.title.toLowerCase(), cl = card.subCategory.toLowerCase(),
          ml = categoryLabel(card.mainCategory).toLowerCase(),
          ql = (card.question||'').toLowerCase(), bl = card.advice.toLowerCase(),
          sl = (card.source || '').toLowerCase();
    if (card.k.some(k => k === q)) s += 100;
    if (card.k.some(k => k.startsWith(q))) s += 60;
    if (card.k.some(k => k.includes(q))) s += 40;
    if (tl.includes(q)) s += 30;
    if (cl.includes(q)) s += 25;
    if (ml.includes(q)) s += 20;
    if (ql.includes(q)) s += 15;
    if (sl.includes(q)) s += 12;
    if (bl.includes(q)) s += 8;
    return { card, s };
  }).filter(x => x.s > 0).sort((a,b) => b.s - a.s);

  results = scored.map(x => x.card);
  idx = 0;
  results.length ? renderReflectionGrid(results, `Suche nach „${q}”`) : renderEmptyState(q);
}

function pickSubCategory(val) {
  const inp = document.getElementById('q');
  if (inp) inp.value = '';
  showFavView = false;
  activeSub = val;
  renderCats();
  renderCurrentView();
}

function resetFilters() {
  const inp = document.getElementById('q');
  if (inp) inp.value = '';
  showFavView = false;
  activeMain = 'all';
  activeSub = 'all';
  setActiveSegment(activeMain);
  renderCats();
  renderCurrentView();
}

function previewText(text, max = 260) {
  const clean = String(text || '').replace(/\s+/g, ' ').trim();
  return clean.length > max ? `${clean.slice(0, max).trim()}…` : clean;
}

function renderCurrentView() {
  const cards = getVisibleCards();
  results = cards;
  idx = 0;
  renderReflectionGrid(cards, activeSub === 'all' ? categoryLabel(activeMain) : activeSub);
}
