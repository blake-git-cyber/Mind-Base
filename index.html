          <div class="grid-card-body">${esc(previewText(card.advice))}</div>
          <div class="grid-card-actions">
            <button class="open-link" onclick="event.stopPropagation(); openCardModal(${jsArg(card.id)})">Karte öffnen</button>
            ${card.source ? `<span class="grid-source">${esc(shortSource(card.source))}</span>` : ''}
            <button class="mini-fav ${favs.includes(card.id) ? 'on' : ''}" onclick="event.stopPropagation(); toggleFav(${jsArg(card.id)})" aria-label="Favorit">
              <i class="bi ${favs.includes(card.id) ? 'bi-heart-fill' : 'bi-heart'}"></i>
            </button>
          </div>
        </article>
      `).join('')}
    </div>
  `;
  document.getElementById('hero')?.classList.add('compact');
}

function renderEmptyState(q) {
  document.getElementById('area').innerHTML = `
    <div class="empty">
      <div class="empty-e"><i class="bi bi-search"></i></div>
      <h3 class="empty-h">Nichts gefunden</h3>
      <p class="empty-t">Keine Karte passt zu „${esc(q)}”. Entferne den Suchbegriff oder setze die Filter zurück.</p>
    </div>
  `;
}

function shortSource(source) {
  const match = String(source).match(/S\\.\\s*\\d+[^,]*/);
  return match ? match[0] : 'Quelle';
}

// ─────────────────────────────────────────────
// DETAIL MODAL
// ─────────────────────────────────────────────
function openCardModal(id) {
  const card = REFLECTIONS.find(item => item.id === String(id));
  if (!card) return;
  const isFav = favs.includes(card.id);
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-kicker">
      <span><i class="bi ${esc(card.icon)}"></i> ${esc(categoryLabel(card.mainCategory))}</span>
    </div>
    <h2 class="modal-title" id="modalTitle">${esc(card.title)}</h2>
    ${card.question ? `<p class="modal-question">${esc(card.question)}</p>` : ''}
    <div class="modal-body">${esc(card.advice)}</div>
    ${card.source ? `<div class="modal-source"><span>Quelle</span>${esc(card.source)}</div>` : ''}
    <div class="modal-actions">
      <button class="modal-fav ${isFav ? 'on' : ''}" onclick="toggleFav(${jsArg(card.id)}); openCardModal(${jsArg(card.id)})">
        <i class="bi ${isFav ? 'bi-heart-fill' : 'bi-heart'}"></i>
        ${isFav ? 'Gespeichert' : 'Merken'}
      </button>
    </div>
  `;
  const modal = document.getElementById('cardModal');
  modal.classList.add('show');
  modal.setAttribute('aria-hidden', 'false');
  playSound('open');
}

function closeCardModal(event) {
  if (event && event.target.closest('.detail-modal') && !event.target.closest('.modal-close')) return;
  const modal = document.getElementById('cardModal');
  modal.classList.remove('show');
  modal.setAttribute('aria-hidden', 'true');
}

// ─────────────────────────────────────────────
// FAVORITES
// ─────────────────────────────────────────────
function toggleFav(id) {
  id = String(id);
  const i = favs.indexOf(id);
  if (i === -1) { favs.push(id); showToast('❤️ Gespeichert'); playSound('save'); }
  else { favs.splice(i,1); showToast('Entfernt'); playSound('soft'); }
  localStorage.setItem('sk-favs', JSON.stringify(favs));
  updateFavBtn();
  renderCurrentView();
}

function showFavs() {
  if (!favs.length) { showToast('Noch keine gespeicherten Karten'); return; }
  showFavView = true;
  const inp = document.getElementById('q');
  if (inp) inp.value = '';
  activeSub = 'all';
  document.getElementById('hero')?.classList.add('compact');
  const fc = REFLECTIONS.filter(c => favs.includes(c.id));
  results = fc;
  renderReflectionGrid(fc, 'Favoriten');
}

function updateFavBtn() {
  document.getElementById('favBtn').innerHTML = `<i class="bi ${favs.length ? 'bi-heart-fill' : 'bi-heart'}"></i>`;
}

// ─────────────────────────────────────────────
// CATEGORIES
// ─────────────────────────────────────────────
function categoryLabel(id) {
  return (MAIN_CATEGORIES.find(section => section.id === id) || MAIN_CATEGORIES[0]).label;
}

function getCardMain(card) {
  const haystack = `${card.t} ${card.c} ${(card.k || []).join(' ')}`;
  if (/kritik|vergebung|vergeben|groll|feuerprobe|vergangenheit|schlecht über jemanden/i.test(haystack)) return 'kritik';
  if (/problem|ordnung|verantwortung|handlung|tageseinheiten|ddigh|limits|grenzen|unaufhörliche sorgen/i.test(haystack)) return 'selbstfuehrung';
  const section = MAIN_CATEGORIES.slice(1).find(item => item.match && item.match.test(haystack));
  return section ? section.id : 'mindset';
}

function getMainCards(id) {
  return id === 'all' ? REFLECTIONS : REFLECTIONS.filter(card => card.mainCategory === id);
}

function getVisibleCards() {
  const mainCards = getMainCards(activeMain);
  return activeSub === 'all' ? mainCards : mainCards.filter(card => card.subCategory === activeSub);
}

function renderMainSegments() {
  const el = document.getElementById('mainseg');
  el.innerHTML = `
    <span class="seg-indicator" id="segIndicator"></span>
    ${MAIN_CATEGORIES.map(section => {
      const count = getMainCards(section.id).length;
      return `<button class="seg-btn ${section.id === activeMain ? 'on' : ''}" title="${esc(section.label)}" data-seg="${section.id}" onclick="pickMain('${section.id}')"><i class="bi ${esc(section.icon)}"></i><span>${esc(section.short || section.label)}</span><small>${count}</small></button>`;
    }).join('')}
  `;
  moveSegmentIndicator();
  setTimeout(moveSegmentIndicator, 80);
}

function setActiveSegment(id) {
  document.querySelectorAll('.seg-btn').forEach(btn => {
    btn.classList.toggle('on', btn.dataset.seg === id);
  });
  moveSegmentIndicator();
}

function moveSegmentIndicator() {
  const update = () => {
    const wrap = document.getElementById('mainseg');
    const indicator = document.getElementById('segIndicator');
    const active = wrap && wrap.querySelector('.seg-btn.on');
    if (!wrap || !indicator || !active) return;
    indicator.style.width = `${active.offsetWidth}px`;
    indicator.style.height = `${active.offsetHeight}px`;
    indicator.style.transform = `translate(${active.offsetLeft - 5}px, ${active.offsetTop - 5}px)`;
    active.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  };
  update();
  requestAnimationFrame(update);
}

function pickMain(id) {
  if (activeMain === id) return;
  activeMain = id;
  activeSub = 'all';
  const inp = document.getElementById('q');
  if (inp) inp.value = '';
  showFavView = false;
  setActiveSegment(id);
  renderCurrentView();
  playSound('nav');
}

function renderCats() {
  const el = document.getElementById('cats');
  if (!el) return;
  el.innerHTML = '';
  return;
  const cats = activeMain === 'all' ? [] : [...new Set(getMainCards(activeMain).map(c => c.subCategory))];
  el.innerHTML = activeMain === 'all'
    ? `<span class="chip-note">Wähle eine Hauptkategorie, um passende Aspekte zu sehen.</span>`
    : [
      `<button class="pill ${activeSub === 'all' ? 'on' : ''}" onclick="pickSubCategory('all')">Alle Aspekte</button>`,
      ...cats.map(cat => `<button class="pill ${activeSub === cat ? 'on' : ''}" onclick="pickSubCategory(${jsArg(cat)})">${esc(cat)}</button>`)
    ].join('');
}

// ─────────────────────────────────────────────
// BG CARDS
// ─────────────────────────────────────────────
function renderBgCards() {
  const positions = [
    {top:'4%',left:'-4%',rot:'-8deg'}, {top:'8%',right:'-3%',rot:'6deg'},
    {top:'32%',left:'-7%',rot:'3deg'}, {top:'38%',right:'-4%',rot:'-5deg'},
    {top:'62%',left:'4%',rot:'-3deg'}, {top:'68%',right:'1%',rot:'8deg'},
    {top:'82%',left:'38%',rot:'-2deg'}, {top:'14%',left:'32%',rot:'9deg'},
  ];
  document.getElementById('bgcards').innerHTML = positions.map((p, i) => {
    const c = CARDS[i * 6 % CARDS.length];
    const style = Object.entries(p).filter(([k]) => k !== 'rot')
      .map(([k,v]) => `${k}:${v}`).join(';');
    return `<div class="bgc" style="${style};--r2:${p.rot};animation-delay:${-i*3.5}s">
      <div class="bgc-t">${c.t}</div>
      <div class="bgc-b">${c.c.slice(0,55)}…</div>
    </div>`;
  }).join('');
}

// ─────────────────────────────────────────────
// SOUND
// ─────────────────────────────────────────────
let actx;
const SOUND_PRESETS = {
  open: {notes:[196,293.66,392], offsets:[0,.09,.18], duration:1.45, gain:.030, wave:'sine', filter:900, delay:.18, feedback:.22, wet:.28},
  nav: {notes:[174.61,261.63], offsets:[0,.12], duration:1.05, gain:.024, wave:'sine', filter:760, delay:.16, feedback:.18, wet:.24},
  save: {notes:[587.33,739.99,987.77], offsets:[0,.04,.10], duration:.38, gain:.05, wave:'sine', filter:2200},
  soft: {notes:[220,329.63], offsets:[0,.14], duration:1.15, gain:.022, wave:'sine', filter:820, delay:.17, feedback:.18, wet:.24},
};

function playSound(kind = 'soft') {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const preset = SOUND_PRESETS[kind] || SOUND_PRESETS.soft;
    const now = actx.currentTime;
    const master = actx.createGain();
    const filter = actx.createBiquadFilter();
    const delay = actx.createDelay();
    const feedback = actx.createGain();
    const wet = actx.createGain();

    master.gain.setValueAtTime(0.0001, now);
    master.gain.exponentialRampToValueAtTime(preset.gain, now + .018);
    master.gain.exponentialRampToValueAtTime(0.0001, now + preset.duration);

    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(preset.filter, now);
    filter.Q.setValueAtTime(.45, now);
    delay.delayTime.setValueAtTime(preset.delay || .055, now);
    feedback.gain.setValueAtTime(preset.feedback ?? .16, now);
    wet.gain.setValueAtTime(preset.wet ?? .18, now);

    master.connect(filter);
    filter.connect(actx.destination);
    filter.connect(delay);
    delay.connect(feedback);
    feedback.connect(delay);
    delay.connect(wet);
    wet.connect(actx.destination);

    preset.notes.forEach((freq, index) => {
      const start = now + (preset.offsets[index] || 0);
      const osc = actx.createOscillator();
      const voice = actx.createGain();
      osc.type = preset.wave;
      osc.frequency.setValueAtTime(freq, start);
      osc.detune.setValueAtTime(index % 2 ? 2 : -2, start);
      voice.gain.setValueAtTime(0.0001, start);
      voice.gain.exponentialRampToValueAtTime(1 / preset.notes.length, start + .08);
      voice.gain.exponentialRampToValueAtTime(0.0001, now + preset.duration);
      osc.connect(voice);
      voice.connect(master);
      osc.start(start);
      osc.stop(now + preset.duration + .05);
    });
  } catch(e){}
}
function toggleSound() {
  soundOn = !soundOn;
  localStorage.setItem('sk-sound', soundOn);
  updateSndBtn();
  showToast(soundOn ? '🔔 Sound an' : '🔕 Sound aus');
}
function updateSndBtn() {
  document.getElementById('sndBtn').innerHTML = `<i class="bi ${soundOn ? 'bi-bell' : 'bi-bell-slash'}"></i>`;
}

// ─────────────────────────────────────────────
// TOAST
// ─────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

init();
</script>
